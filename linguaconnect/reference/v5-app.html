/* ============================================================
   19. Calls - WebRTC signalled through the shared database
   ============================================================ */
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

/* Every handle this module owns is declared here, before use. */
const C={
  active:false, role:null, cid:null, callId:null, peer:null, mode:"video",
  status:"idle", pc:null, local:null, remote:null,
  micOn:true, camOn:true, message:"",
  appliedRemote:0, pendingLocal:[], flushHandle:null, unsubDoc:null, dismissed:{},
  demo:false, demoHandle:null, tickHandle:null, connectedAt:0
};
let incomingCalls=[];

function callDocRef(cid){ return db.doc("calls/"+cid); }
function fmtDuration(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
/* Updates only the status line once a second, so the <video> elements are
   never rebuilt mid-call. */
function tickCall(){
  const el=$("c-status");
  if(el&&C.status==="connected"&&C.connectedAt) el.textContent=callStatusLabel()+(C.mode==="audio"?" · audio only":"");
}
function markConnected(){
  if(!C.connectedAt) C.connectedAt=Date.now();
  if(!C.tickHandle) C.tickHandle=setInterval(tickCall,1000);
}
/* Demo calls run the real call screen, with your own camera and mic, but
   no second person: the partner side is simulated. */
async function startDemoCall(peer,mode,answered){
  if(C.active){ toast("You are already in a call."); return; }
  C.active=true; C.demo=true; C.role=answered?"callee":"caller"; C.peer=peer; C.mode=mode;
  C.callId="demo_"+Date.now().toString(36); C.status=answered?"connecting":"calling";
  C.message=""; C.camOn=mode==="video"; C.micOn=true;
  renderCallUI();
  try{ C.local=await getMedia(mode); }
  catch(e){
    C.local=null;
    C.message=(e&&e.name==="NotAllowedError")
      ?"Camera/mic access is blocked, so you won't see yourself - the demo carries on without it."
      :"No camera or mic available here - the demo carries on without it.";
  }
  if(!C.active) { if(C.local) C.local.getTracks().forEach(t=>t.stop()); return; }
  if(!answered){ C.status="ringing"; renderCallUI(); }
  C.demoHandle=setTimeout(()=>{
    if(!C.active||!C.demo) return;
    C.status="connected"; markConnected(); renderCallUI();
  },answered?900:2600);
}
function resetCall(){
  if(C.demoHandle){ clearTimeout(C.demoHandle); C.demoHandle=null; }
  if(C.tickHandle){ clearInterval(C.tickHandle); C.tickHandle=null; }
  C.demo=false; C.connectedAt=0;
  if(C.flushHandle){ clearTimeout(C.flushHandle); C.flushHandle=null; }
  if(C.unsubDoc){ try{ C.unsubDoc(); }catch(e){} C.unsubDoc=null; }
  if(C.pc){ try{ C.pc.close(); }catch(e){} C.pc=null; }
  if(C.local){ C.local.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); }
  C.active=false; C.role=null; C.cid=null; C.callId=null; C.peer=null;
  C.status="idle"; C.local=null; C.remote=null; C.micOn=true; C.camOn=true;
  C.message=""; C.appliedRemote=0; C.pendingLocal=[];
  callLayer.innerHTML="";
}
function flushCandidates(){
  if(C.flushHandle){ clearTimeout(C.flushHandle); C.flushHandle=null; }
  if(!C.cid||!C.pendingLocal.length) return;
  const batch=C.pendingLocal.splice(0,C.pendingLocal.length);
  const field=C.role==="caller"?"offerCands":"ansCands";
  const path="calls/"+C.cid;
  qWrite(path,async()=>{
    const snap=await callDocRef(C.cid).get();
    if(!snap.exists) return;
    const cur=snap.data()||{};
    if(cur.callId!==C.callId) return;
    const patch={};
    patch[field]=(cur[field]||[]).concat(batch).slice(-60);
    await callDocRef(C.cid).update(patch);
  }).catch(()=>{});
}
function queueCandidate(c){
  C.pendingLocal.push(c);
  if(C.flushHandle) return;
  C.flushHandle=setTimeout(flushCandidates,450);
}
async function getMedia(mode){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    throw new Error("This browser will not give the page a camera or microphone.");
  return await navigator.mediaDevices.getUserMedia({audio:true,video:mode==="video"});
}
function buildPeer(){
  const pc=new RTCPeerConnection(ICE);
  C.remote=new MediaStream();
  pc.ontrack=e=>{
    e.streams[0].getTracks().forEach(t=>{ if(C.remote.getTrackById(t.id)==null) C.remote.addTrack(t); });
    renderCallUI();
  };
  pc.onicecandidate=e=>{ if(e.candidate) queueCandidate(e.candidate.toJSON()); };
  pc.onconnectionstatechange=()=>{
    if(!C.active) return;
    if(pc.connectionState==="connected"){ C.status="connected"; C.message=""; markConnected(); }
    else if(pc.connectionState==="failed"){
      C.status="failed";
      C.message="The direct connection could not be established. This prototype uses public STUN only - a real deployment needs a TURN relay for restrictive networks.";
    }
    renderCallUI();
  };
  C.local.getTracks().forEach(t=>pc.addTrack(t,C.local));
  return pc;
}
function watchCallDoc(){
  if(C.unsubDoc){ try{ C.unsubDoc(); }catch(e){} }
  C.unsubDoc=callDocRef(C.cid).onSnapshot(async snap=>{
    if(!C.active) return;
    if(!snap.exists){ endCall(true,"The call ended."); return; }
    const d=snap.data()||{};
    if(d.callId!==C.callId) return;
    try{
      if(C.role==="caller"&&d.status==="accepted"&&d.answer&&C.pc&&!C.pc.currentRemoteDescription){
        await C.pc.setRemoteDescription(new RTCSessionDescription(d.answer));
        C.status="connecting"; renderCallUI();
      }
      const theirs=(C.role==="caller"?d.ansCands:d.offerCands)||[];
      if(theirs.length>C.appliedRemote&&C.pc&&C.pc.remoteDescription){
        for(let i=C.appliedRemote;i<theirs.length;i++){
          try{ await C.pc.addIceCandidate(new RTCIceCandidate(theirs[i])); }catch(e){}
        }
        C.appliedRemote=theirs.length;
      }
      if(d.status==="declined"){ endCall(true,nameOf(C.peer)+" declined."); return; }
      if(d.status==="ended"){ endCall(true,"Call ended."); return; }
    }catch(e){ console.warn("call signalling",e); }
  },e=>{ console.warn("call snapshot",e); });
}
async function startCall(otherId,mode){
  if(C.active){ toast("You are already in a call."); return; }
  if((S.settings.blocks||[]).indexOf(otherId)>=0){ toast("Unblock "+nameOf(otherId)+" to call them."); return; }
  if(isDemo(otherId)) return startDemoCall(otherId,mode,false);
  const cid=convId(S.uid,otherId);
  C.active=true; C.role="caller"; C.cid=cid; C.peer=otherId; C.mode=mode;
  C.callId="c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  C.status="calling"; C.message=""; C.appliedRemote=0; C.camOn=mode==="video";
  renderCallUI();
  try{
    C.local=await getMedia(mode);
    C.pc=buildPeer();
    const offer=await C.pc.createOffer();
    await C.pc.setLocalDescription(offer);
    await qWrite("calls/"+cid,()=>callDocRef(cid).set({
      participants:[S.uid,otherId].sort(),callId:C.callId,from:S.uid,to:otherId,mode:mode,
      status:"ringing",offer:{type:offer.type,sdp:offer.sdp},answer:null,
      offerCands:[],ansCands:[],startedAt:Date.now()
    }));
    C.status="ringing";
    watchCallDoc();
    renderCallUI();
  }catch(e){
    console.error(e);
    C.status="failed";
    C.message=(e&&e.name==="NotAllowedError")
      ?"Camera and microphone access was blocked. Allow it for this page and try again."
      :(e&&e.message)||"Could not start the call.";
    renderCallUI();
  }
}
async function acceptCall(doc){
  if(C.active){ toast("You are already in a call."); return; }
  C.active=true; C.role="callee"; C.cid=doc.id; C.peer=doc.from; C.mode=doc.mode||"video";
  C.callId=doc.callId; C.status="connecting"; C.message=""; C.appliedRemote=0; C.camOn=C.mode==="video";
  renderCallUI();
  try{
    C.local=await getMedia(C.mode);
    C.pc=buildPeer();
    await C.pc.setRemoteDescription(new RTCSessionDescription(doc.offer));
    const answer=await C.pc.createAnswer();
    await C.pc.setLocalDescription(answer);
    await qWrite("calls/"+C.cid,()=>callDocRef(C.cid).update({
      status:"accepted",answer:{type:answer.type,sdp:answer.sdp}
    }));
    const theirs=doc.offerCands||[];
    for(let i=0;i<theirs.length;i++){ try{ await C.pc.addIceCandidate(new RTCIceCandidate(theirs[i])); }catch(e){} }
    C.appliedRemote=theirs.length;
    watchCallDoc();
    renderCallUI();
  }catch(e){
    console.error(e);
    C.status="failed";
    C.message=(e&&e.name==="NotAllowedError")
      ?"Camera and microphone access was blocked. Allow it for this page and try again."
      :(e&&e.message)||"Could not join the call.";
    renderCallUI();
  }
}
function declineCall(doc){
  C.dismissed[doc.callId]=true;
  qWrite("calls/"+doc.id,()=>callDocRef(doc.id).update({status:"declined"})).catch(()=>{});
  render();
}
function endCall(remote,msg){
  const cid=C.cid, id=C.callId;
  if(!remote&&cid){
    qWrite("calls/"+cid,()=>callDocRef(cid).update({status:"ended"})).catch(()=>{});
  }
  if(id) C.dismissed[id]=true;
  resetCall();
  if(msg) toast(msg);
  render();
}
function toggleMic(){
  if(!C.local){ toast("No microphone in this call."); return; }
  C.micOn=!C.micOn;
  C.local.getAudioTracks().forEach(t=>{ t.enabled=C.micOn; });
  renderCallUI();
}
function toggleCam(){
  if(!C.local){ toast("No camera in this call."); return; }
  C.camOn=!C.camOn;
  C.local.getVideoTracks().forEach(t=>{ t.enabled=C.camOn; });
  renderCallUI();
}
function callStatusLabel(){
  if(C.status==="connected"&&C.connectedAt) return "Connected · "+fmtDuration(Date.now()-C.connectedAt);
  return {calling:"Starting…",ringing:"Ringing…",connecting:"Connecting…",
    connected:"Connected",failed:"Could not connect"}[C.status]||"";
}
function renderCallUI(){
  if(!C.active){ callLayer.innerHTML=""; return; }
  const showVideo=C.mode==="video";
  const live=C.status==="connected";
  /* Partner side: their video on a real call; their photo when it is audio
     only, still ringing, or the demo (which has no one on the other end). */
  const partnerPhoto='<div style="display:flex;flex-direction:column;align-items:center;gap:12px;">'+
      '<img class="call-demo-av'+(live?" live":"")+'" src="'+esc(avatarOf(C.peer))+'" alt="">'+
      (C.demo?"":'<audio id="v-remote" autoplay></audio>')+'</div>';
  const partner=(showVideo&&!C.demo)?'<video class="remote" id="v-remote" autoplay playsinline></video>':partnerPhoto;
  const selfTile=showVideo
    ? ((C.local&&C.camOn)?'<video class="local" id="v-local" autoplay playsinline muted></video>'
        :'<div class="cam-off">'+(C.local?"Your camera is off":"No camera")+'</div>')
    : "";
  const btn=(id,cls,label,glyph)=>'<div class="call-btn-wrap"><button class="call-btn'+cls+'" id="'+id+'" title="'+label+'" aria-label="'+label+'">'+glyph+'</button><span>'+label+'</span></div>';
  callLayer.innerHTML=
    '<div class="call-stage">'+
      partner+selfTile+
      '<div class="call-info"><div class="nm">'+esc(nameOf(C.peer))+'</div>'+
        '<div class="st" id="c-status">'+esc(callStatusLabel())+(C.mode==="audio"?" · audio only":"")+'</div>'+
        (C.message?'<div style="color:#FCA5A5;font-size:12.5px;max-width:44ch;margin:6px auto 0;">'+esc(C.message)+'</div>':"")+
        (C.demo?'<div class="call-demo-note">Demo call - nobody is on the other end. With a real match you\'d see and hear them here.</div>':"")+
      '</div>'+
    '</div>'+
    '<div class="call-bar">'+
      btn("c-mic",C.micOn?"":" off",C.micOn?"Mute":"Unmute",C.micOn?"🎙":"🔇")+
      (showVideo?btn("c-cam",C.camOn?"":" off",C.camOn?"Camera":"Camera off",C.camOn?"📷":"🚫"):"")+
      btn("c-end"," hang","End","✕")+
    '</div>';
  const r=$("v-remote"); if(r&&C.remote&&r.srcObject!==C.remote) r.srcObject=C.remote;
  const l=$("v-local"); if(l&&C.local&&l.srcObject!==C.local) l.srcObject=C.local;
  const mic=$("c-mic"); if(mic) mic.onclick=toggleMic;
  const cam=$("c-cam"); if(cam) cam.onclick=toggleCam;
  $("c-end").onclick=()=>endCall(false,null);
}
function renderIncomingCall(){
  if(C.active) return;
  const now=Date.now();
  const blocks=S.settings.blocks||[];
  const ring=incomingCalls.concat(S.demoRing?[S.demoRing]:[]).filter(d=>d.status==="ringing"&&d.to===S.uid&&
    blocks.indexOf(d.from)<0&&!C.dismissed[d.callId]&&now-(d.startedAt||0)<90000)[0];
  const existing=document.querySelector(".incoming");
  if(!ring){ if(existing) existing.remove(); return; }
  if(existing&&existing.dataset.callId===ring.callId) return;
  if(existing) existing.remove();
  const el=document.createElement("div");
  el.className="incoming"; el.dataset.callId=ring.callId;
  el.innerHTML='<div class="row">'+avatarHtml(ring.from,"m",false)+
    '<div><div style="font-weight:700;">'+esc(nameOf(ring.from))+'</div>'+
    '<div class="mini">Incoming '+(ring.mode==="audio"?"📞 phone":"🎥 video")+' call</div></div></div>'+
    '<div class="row" style="gap:8px;"><button class="btn primary sm" id="in-accept">Accept</button>'+
    '<button class="btn ghost sm" id="in-decline">Decline</button></div>';
  document.body.appendChild(el);
  const fromDemo=isDemo(ring.from);
  el.querySelector("#in-accept").onclick=()=>{
    el.remove();
    if(fromDemo){ S.demoRing=null; startDemoCall(ring.from,ring.mode,true); } else acceptCall(ring);
  };
  el.querySelector("#in-decline").onclick=()=>{
    el.remove();
    if(fromDemo){ S.demoRing=null; toast("Call declined."); render(); } else declineCall(ring);
  };
}

/* ============================================================
   20. Live subscriptions
   ============================================================ */
function docsOf(snap){
  return snap.docs.map(d=>Object.assign({id:d.id},d.data()));
}
/* Names and avatars are resolved per render, never stored: they differ
   from viewer to viewer and go stale the moment someone renames. */
let resolving=false;
async function resolvePeople(ids){
  if(!userCap||resolving) return;
  const want=ids.filter(id=>id&&!S.people[id]);
  if(!want.length) return;
  resolving=true;
  try{
    const got=await userCap.profiles(ids);
    Object.keys(got||{}).forEach(k=>{ S.people[k]=got[k]; });
    render();
  }catch(e){ /* user reads never reject, but stay defensive */ }
  resolving=false;
}
function refreshNames(){
  const ids={};
  S.profiles.forEach(p=>{ ids[p.id]=1; });
  S.rooms.forEach(r=>{ ids[r.createdBy]=1; });
  S.assignments.forEach(a=>{ ids[a.studentId]=1; ids[a.teacherId]=1; });
  S.reports.forEach(r=>{ ids[r.reporterId]=1; ids[r.reportedId]=1; });
  if(S.uid) ids[S.uid]=1;
  resolvePeople(Object.keys(ids));
}
function sub(name,ref,onNext){
  if(unsub[name]){ try{ unsub[name](); }catch(e){} delete unsub[name]; }
  unsub[name]=ref.onSnapshot(onNext,e=>{
    console.warn("subscription "+name+" ended",e);
    if(e&&e.code==="revoked") S.banner="Your access to this app changed. Reopen the page to continue.";
    render();
  });
}
function startSubscriptions(){
  sub("profiles",db.collection("profiles"),snap=>{
    S.profiles=docsOf(snap).map(p=>Object.assign({},p,{speaks:normLangs(p.speaks),practices:normLangs(p.practices)}));
    const mine=S.profiles.filter(p=>p.id===S.uid)[0]||null;
    S.profile=mine; S.profileLoaded=true;
    if(mine) seedDemo();
    refreshNames(); render();
  });
  sub("settings",settingsDoc(),snap=>{
    if(snap.exists){
      const d=snap.data()||{};
      S.settings=Object.assign({pins:[],mutes:[],blocks:[],archives:[],favorites:[],quizHistory:[],lastRead:{},
        streak:{count:0,lastDate:""},schedule:[],premium:false},d);
    }
    render();
  });
  sub("account",accountDoc(),snap=>{
    const d=snap.exists?(snap.data()||{}):{};
    S.account={email:d.email||"",emailVerified:!!d.emailVerified};
    S.accountLoaded=true;
    if(S.onboard&&!S.onboard.email&&S.account.email) S.onboard.email=S.account.email;
    render();
  });
  sub("convs",db.collection("conversations").where("participants","array-contains",S.uid),snap=>{
    S.convs=docsOf(snap); render();
  });
  sub("rooms",db.collection("rooms"),snap=>{
    S.rooms=docsOf(snap).sort((a,b)=>b.createdAt-a.createdAt);
    refreshNames(); render();
  });
  sub("calls",db.collection("calls").where("participants","array-contains",S.uid),snap=>{
    incomingCalls=docsOf(snap); render();
  });
  sub("certs",db.collection("certs"),snap=>{ S.certs=docsOf(snap); render(); });
  sub("assignments",db.collection("assignments"),snap=>{
    S.assignments=docsOf(snap).filter(a=>a.studentId===S.uid||a.teacherId===S.uid);
    refreshNames(); render();
  });
}
/* The open thread and the open room are subscribed on demand, so the
   page never holds a listener for every conversation at once. */
let watchedThread=null, watchedRoom=null;
function syncOnDemandSubs(){
  const cid=(S.selected&&!isDemo(S.selected))?convId(S.uid,S.selected):null;
  if(cid!==watchedThread){
    watchedThread=cid;
    if(unsub.thread){ try{ unsub.thread(); }catch(e){} delete unsub.thread; }
    if(cid) sub("thread",threadDoc(cid),snap=>{
      S.threads[cid]=snap.exists?(snap.data()||{messages:[]}):{messages:[]};
      render();
      const box=view.querySelector(".msgs");
      if(box&&box.scrollHeight-box.scrollTop-box.clientHeight<140) box.scrollTop=box.scrollHeight;
    });
  }
  const rid=S.tab==="groups"?S.groups.activeId:null;
  if(rid!==watchedRoom){
    watchedRoom=rid;
    if(unsub.roomchat){ try{ unsub.roomchat(); }catch(e){} delete unsub.roomchat; }
    if(rid) sub("roomchat",db.doc("roomchats/"+rid),snap=>{
      S.roomLog[rid]=snap.exists?(snap.data()||{messages:[]}):{messages:[]};
      render();
    });
  }
  if(S.me&&S.me.isOwner&&!unsub.reports){
    sub("reports",db.collection("reports"),snap=>{ S.reports=docsOf(snap); refreshNames(); render(); });
  }
}

/* ============================================================
   21. Boot
   ============================================================ */
function paintFirstFrame(){
  renderChrome();
  renderBooting();
}
async function boot(){
  paintFirstFrame();

  /* One try/catch around the whole start-up: a failure in any single
     step degrades that feature instead of freezing the page. */
  let caps;
  try{
    caps=await Promise.all([
      claudeUse("db"), claudeUse("user"), claudeUse("sample"), claudeUse("room")
    ]);
  }catch(e){ caps=[null,null,null,null]; }
  db=caps[0]; userCap=caps[1]; sampleFn=caps[2]; roomCap=caps[3];

  if(userCap){
    try{ S.me=await userCap.me(); S.uid=S.me.id; }catch(e){}
    try{ S.canWrite=await userCap.can("data.write"); }catch(e){ S.canWrite=null; }
    if(S.uid&&S.me) S.people[S.uid]={id:S.uid,name:S.me.name,avatarUrl:S.me.avatarUrl,color:S.me.color,email:null,isMe:true};
  }
  capsSettled=true;

  if(!db||!S.uid){ render(); return; }

  try{ startSubscriptions(); }
  catch(e){ console.error("subscriptions failed",e); S.banner=dbErrorCopy(e); }

  /* Local-time readouts on profiles tick once a minute. */
  if(clockHandle){ clearInterval(clockHandle); clockHandle=null; }
  clockHandle=setInterval(()=>{ if(S.tab==="discover"||S.tab==="schedule"||S.tab==="conversations") render(); },60000);

  if(roomCap){
    try{
      roomCap.onPeers(change=>{
        const map={};
        (change&&change.peers||[]).forEach(p=>{
          const id=(p&&p.presence&&p.presence.uid)||(p&&p.by)||null;
          if(id) map[id]=true;
        });
        S.online=map; render();
      },()=>{});
      roomCap.presence({uid:S.uid}).catch(()=>{});
    }catch(e){ /* presence is decoration - never let it stop the app */ }
  }
  render();
}
/* `window.claude` may not exist at all outside a viewer, so every reach
   for it is guarded rather than assumed. */
function claudeUse(name){
  try{
    if(!window.claude||typeof window.claude.use!=="function") return Promise.resolve(null);
    return window.claude.use(name).catch(()=>null);
  }catch(e){ return Promise.resolve(null); }
}

/* Keep the on-demand subscriptions in step with whatever is on screen. */
const baseRender=renderNow;
renderNow=function(){ baseRender(); if(db&&S.uid) syncOnDemandSubs(); };

window.addEventListener("beforeunload",()=>{
  Object.keys(unsub).forEach(k=>{ try{ unsub[k](); }catch(e){} });
  if(clockHandle) clearInterval(clockHandle);
  if(presenceHandle) clearInterval(presenceHandle);
  toastHandles.forEach(h=>clearTimeout(h));
  if(C.active) resetCall();
});

boot();
})();
</script>
