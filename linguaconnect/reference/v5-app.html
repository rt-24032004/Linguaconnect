<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>LinguaConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#EEF2F7;
  --ink:#1E293B; --ink-soft:#64748B; --ink-faint:#94A3B8;
  --accent:#4F46E5; --accent-strong:#4338CA; --accent-wash:#EEF0FE; --on-accent:#FFFFFF;
  --teal:#0D9488; --teal-wash:#E6F6F4;
  --line:#E2E8F0; --line-strong:#CBD5E1;
  --good:#15803D; --good-wash:#E7F6EC;
  --warn:#B45309; --warn-wash:#FEF3C7;
  --danger:#B91C1C; --danger-wash:#FDECEC;
  --tier-a-fg:#0F766E; --tier-a-bg:#CCFBF1;
  --tier-b-fg:#4338CA; --tier-b-bg:#E0E7FF;
  --tier-c-fg:#B45309; --tier-c-bg:#FEF3C7;
  --bubble-me:#4F46E5; --bubble-me-ink:#FFFFFF;
  --bubble-them:#EEF2F7; --bubble-them-ink:#1E293B;
  --shadow-1:0 1px 2px rgba(15,23,42,.06);
  --shadow-2:0 6px 20px -8px rgba(15,23,42,.22);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Manrope','Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F172A; --surface:#1B2436; --surface-2:#182135; --surface-3:#243044;
    --ink:#E2E8F0; --ink-soft:#94A3B8; --ink-faint:#64748B;
    --accent:#818CF8; --accent-strong:#A5B4FC; --accent-wash:#242C4A; --on-accent:#0F172A;
    --teal:#2DD4BF; --teal-wash:#12332F;
    --line:#2E3B52; --line-strong:#3E4C66;
    --good:#4ADE80; --good-wash:#14301F;
    --warn:#FBBF24; --warn-wash:#33280D;
    --danger:#F87171; --danger-wash:#3A1A1A;
    --tier-a-fg:#5EEAD4; --tier-a-bg:#12332F;
    --tier-b-fg:#A5B4FC; --tier-b-bg:#252D4D;
    --tier-c-fg:#FCD34D; --tier-c-bg:#33280D;
    --bubble-me:#4F46E5; --bubble-me-ink:#F8FAFF;
    --bubble-them:#243044; --bubble-them-ink:#E2E8F0;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F172A; --surface:#1B2436; --surface-2:#182135; --surface-3:#243044;
  --ink:#E2E8F0; --ink-soft:#94A3B8; --ink-faint:#64748B;
  --accent:#818CF8; --accent-strong:#A5B4FC; --accent-wash:#242C4A; --on-accent:#0F172A;
  --teal:#2DD4BF; --teal-wash:#12332F;
  --line:#2E3B52; --line-strong:#3E4C66;
  --good:#4ADE80; --good-wash:#14301F;
  --warn:#FBBF24; --warn-wash:#33280D;
  --danger:#F87171; --danger-wash:#3A1A1A;
  --tier-a-fg:#5EEAD4; --tier-a-bg:#12332F;
  --tier-b-fg:#A5B4FC; --tier-b-bg:#252D4D;
  --tier-c-fg:#FCD34D; --tier-c-bg:#33280D;
  --bubble-me:#4F46E5; --bubble-me-ink:#F8FAFF;
  --bubble-them:#243044; --bubble-them-ink:#E2E8F0;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 8px 24px -10px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2;letter-spacing:-.01em;}
p{margin:0;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* ---------- shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);}
.topbar-inner{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1280px;margin:0 auto;width:100%;}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;}
.wordmark .glyph{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--teal));display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0;}
.topbar-spacer{flex:1;}
.whoami{display:flex;align-items:center;gap:8px;min-width:0;}
.whoami .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.tab-rail{background:var(--surface);border-bottom:1px solid var(--line);}
.tab-rail-inner{display:flex;gap:2px;padding:0 10px;max-width:1280px;margin:0 auto;overflow-x:auto;}
.tab-btn{position:relative;background:none;border:0;padding:11px 12px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .12s,border-color .12s;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-badge{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-size:10px;font-weight:600;line-height:18px;text-align:center;vertical-align:1px;}
#view{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:22px 16px 56px;}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}

/* ---------- type utilities ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);}
.h-page{font-size:23px;font-weight:800;}
.h-sec{font-size:16px;font-weight:700;}
.sub{color:var(--ink-soft);font-size:13.5px;max-width:62ch;}
.mini{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
.num{font-variant-numeric:tabular-nums;}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0;}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-1);}
.panel.flush{padding:0;overflow:hidden;}
.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:center;gap:12px;}
.row.wrap{flex-wrap:wrap;}

/* ---------- controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;}
.field > label{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
input[type=text],input[type=email],input[type=search],input[type=datetime-local],input[type=number],select,textarea{
  width:100%;padding:9px 11px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:14px;}
textarea{resize:vertical;min-height:84px;line-height:1.5;}
input::placeholder,textarea::placeholder{color:var(--ink-faint);}
select{cursor:pointer;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);border:1px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.primary{background:var(--accent);color:var(--on-accent);}
.btn.primary:not(:disabled):hover{background:var(--accent-strong);}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink);}
.btn.ghost:not(:disabled):hover{background:var(--surface-3);}
.btn.quiet{background:none;color:var(--ink-soft);padding:6px 9px;}
.btn.quiet:hover{background:var(--surface-3);color:var(--ink);}
.btn.danger{background:var(--danger-wash);color:var(--danger);border-color:transparent;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn.block{width:100%;}
.icon-btn{background:none;border:0;padding:5px 7px;border-radius:6px;color:var(--ink-faint);cursor:pointer;font-size:14px;line-height:1;}
.icon-btn:hover{background:var(--surface-3);color:var(--ink);}
.checkline{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;cursor:pointer;}
.checkline input{margin-top:3px;flex:none;}
.err{background:var(--danger-wash);color:var(--danger);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:500;}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--ink-soft);}
.note.warn{background:var(--warn-wash);border-color:transparent;color:var(--warn);}
.empty{padding:26px 18px;text-align:center;color:var(--ink-faint);font-size:13.5px;border:1px dashed var(--line-strong);border-radius:var(--r);}

/* ---------- identity bits ---------- */
.av{flex:none;border-radius:50%;object-fit:cover;background:var(--surface-3);display:block;}
.av.s{width:34px;height:34px;} .av.m{width:42px;height:42px;} .av.l{width:60px;height:60px;}
.presence{position:relative;flex:none;display:inline-block;line-height:0;}
.presence .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ink-faint);border:2px solid var(--surface);}
.presence.online .dot{background:var(--good);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;}
.pill.tier-a{background:var(--tier-a-bg);color:var(--tier-a-fg);}
.pill.tier-b{background:var(--tier-b-bg);color:var(--tier-b-fg);}
.pill.tier-c{background:var(--tier-c-bg);color:var(--tier-c-fg);}
.pill.ok{background:var(--good-wash);color:var(--good);}
.pill.teal{background:var(--teal-wash);color:var(--teal);}
.pill.warn{background:var(--warn-wash);color:var(--warn);}
.langchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:500;}
.langchip.speak{border-color:color-mix(in srgb,var(--teal) 34%,var(--line));}
.langchip.practice{border-color:color-mix(in srgb,var(--accent) 34%,var(--line));}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.tz{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}

/* ---------- conversations ---------- */
.conv-grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}
.conv-list{display:flex;flex-direction:column;}
.conv-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line);}
.conv-scroll{max-height:clamp(320px,58vh,660px);overflow-y:auto;}
.conv-group-label{padding:9px 15px 5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);background:var(--surface-2);border-bottom:1px solid var(--line);}
.conv-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;}
.conv-row:hover{background:var(--surface-2);}
.conv-row.active{background:var(--accent-wash);}
.conv-row .body{flex:1;min-width:0;}
.conv-row .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.conv-row .prev{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
.conv-row .when{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}
.unread-dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-size:10px;font-weight:600;line-height:18px;text-align:center;}
.thread{display:flex;flex-direction:column;min-height:0;}
.thread-head{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);}
.thread-head .body{flex:1;min-width:0;}
.msgs{height:clamp(300px,50vh,560px);overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2);}
.msg{max-width:min(78%,520px);display:flex;flex-direction:column;gap:3px;}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.them{align-self:flex-start;}
.msg + .msg{margin-top:9px;}
.bubble{padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
.msg.me .bubble{background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:5px;}
.msg.them .bubble{background:var(--bubble-them);color:var(--bubble-them-ink);border-bottom-left-radius:5px;}
.msg-foot{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);}
.msg-foot .act{background:none;border:0;padding:0;color:var(--ink-faint);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px;}
.msg-foot .act:hover{color:var(--accent);}
.translation{border-left:2px solid var(--teal);padding:5px 0 5px 9px;font-size:13px;color:var(--ink-soft);font-style:italic;}
.composer{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-end;}
.composer textarea{min-height:40px;max-height:150px;border-radius:var(--r);}
.daysep{align-self:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:8px 0 2px;}
.back-btn{display:none;}

/* ---------- discover / teachers ---------- */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.person-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow-1);}
.person-card .hd{display:flex;gap:11px;align-items:center;}
.person-card .hd .body{min-width:0;flex:1;}
.person-card .nm{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.person-card .bio{font-size:13px;color:var(--ink-soft);}
.match-strip{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface-2);font-size:12px;color:var(--ink-soft);border-left:3px solid var(--line-strong);}
.match-strip.mutual{border-left-color:var(--teal);background:var(--teal-wash);color:var(--teal);font-weight:600;}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}

/* ---------- test / practice / assignments ---------- */
.q-card{border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:9px;background:var(--surface);}
.q-opts{display:flex;flex-direction:column;gap:6px;}
.q-opt{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-size:13.5px;}
.q-opt:hover{border-color:var(--line-strong);background:var(--surface-2);}
.q-opt input{margin-top:3px;flex:none;}
.result-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:26px 20px;border-radius:var(--r-lg);background:var(--accent-wash);}
.result-level{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:.02em;color:var(--accent);line-height:1;}
.streak-card{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--accent-wash),var(--teal-wash));}
.streak-n{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;color:var(--accent);}
.streak-ladder{display:flex;gap:4px;margin-top:8px;}
.streak-ladder i{width:13px;height:5px;border-radius:3px;background:var(--line-strong);display:block;}
.streak-ladder i.on{background:var(--teal);}
.feedback{background:var(--good-wash);border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
.thinking{display:flex;align-items:center;gap:9px;color:var(--ink-soft);font-size:13.5px;padding:14px 0;}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- certificates / rooms / schedule ---------- */
.cert-row{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:var(--r);}
.cert-thumb{width:64px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;background:var(--surface-3);}
.cert-preview{max-width:220px;border-radius:var(--r-sm);border:1px solid var(--line);margin-top:8px;}
.cert-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--warn-wash);color:var(--warn);font-size:11.5px;font-weight:600;}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:0;}
.list-row .body{flex:1;min-width:0;}
.when-block{flex:none;width:62px;text-align:center;padding:6px 0;border-radius:var(--r-sm);background:var(--surface-2);}
.when-block .d{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
.when-block .t{font-family:var(--mono);font-size:13px;font-weight:600;}
.room-msgs{height:clamp(240px,40vh,420px);overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2);}
.room-msg .who{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px;}
.room-msg .txt{font-size:13.5px;white-space:pre-wrap;word-break:break-word;}

/* ---------- ads ---------- */
.ad{border:1px dashed var(--line-strong);border-radius:var(--r);padding:12px 14px;background:var(--surface-2);}
.ad .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
.ad .hl{font-weight:600;font-size:13.5px;margin-top:3px;}
.ad .sb{font-size:12.5px;color:var(--ink-soft);}

/* ---------- overlays ---------- */
#toast-layer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-2);}
#modal-layer:empty,#menu-layer:empty,#call-layer:empty{display:none;}
#modal-layer{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:22px;max-width:400px;width:100%;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:14px;}
#menu-layer{position:fixed;inset:0;z-index:60;}
.menu{position:absolute;min-width:214px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);padding:5px;display:flex;flex-direction:column;}
.menu button{background:none;border:0;text-align:left;padding:8px 11px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink);}
.menu button:hover{background:var(--surface-3);}
.menu button.danger{color:var(--danger);}

/* ============================================================

{h:"Writing help built for language learners",s:"Catch the mistakes before you hit send."},

function demoOf(id){ return DEMOS.filter(d=>d.id===id)[0]||null; }
function isDemo(id){ return !!demoOf(id); }

  "Nice! Tell me more - what made you start learning?",
  "Nice sentence! One small thing: try it again using the past tense.",
  "Haha, I love that. Want to try a quick video call? Tap Video up top.",

/* ============================================================
   2. Small helpers
   ============================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const langName=code=>{const l=LANGS.find(x=>x[0]===code);return l?l[1]:code;};
const tierOf=lv=>String(lv||"B1")[0].toLowerCase();
const convId=(a,b)=>[a,b].sort().join("__");
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const byTs=(a,b)=>b.ts-a.ts;

function levelPill(lv){
  const L=String(lv||"B1").toUpperCase();
  return '<span class="pill tier-'+tierOf(L)+'" title="'+esc(LEVEL_LABEL[L]||"")+'">'+esc(L)+'</span>';
}
function tzLabel(tz){
  if(!tz) return "Timezone not set";
  try{
    const off=new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"shortOffset"})
      .formatToParts(new Date()).find(p=>p.type==="timeZoneName");
    return tz.replace(/_/g," ")+(off?" "+off.value:"");
  }catch(e){ return tz.replace(/_/g," "); }
}
function tzNow(tz){
  if(!tz) return "";
  try{ return new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit"}).format(new Date()); }
  catch(e){ return ""; }
}
const DEFAULT_TZ=(function(){
  let tz="Europe/Madrid";
  try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz; }catch(e){}
  return TIMEZONES.indexOf(tz)>=0?tz:"Europe/Madrid";
})();
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "now";
  if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h";
  if(s<604800) return Math.floor(s/86400)+"d";
  return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function clockTime(ts){ return new Date(ts).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
function dayKey(ts){ return new Date(ts).toDateString(); }
function dayLabel(ts){
  const t=new Date().toDateString(), y=new Date(Date.now()-86400000).toDateString(), d=dayKey(ts);
  if(d===t) return "Today";
  if(d===y) return "Yesterday";
  return new Date(ts).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayDiff(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function truncate(s,n){ s=String(s||""); return s.length>n?s.slice(0,n-1)+"…":s; }
function normLangs(arr){
  return (Array.isArray(arr)?arr:[]).map(e=>typeof e==="string"?{code:e,level:"B1"}:e)
    .filter(e=>e&&e.code).map(e=>({code:e.code,level:LEVELS.indexOf(e.level)>=0?e.level:"B1"}));
}
/* Initials avatar, used whenever there is no account photo (and for the demo). */
function initialsAvatar(name,seed){
  const parts=String(name||"?").replace(/\(.*?\)/g,"").trim().split(/\s+/);
  const ini=((parts[0]||"?")[0]+((parts[1]||"")[0]||"")).toUpperCase();
  const hues=[238,172,24,330,200,280];
  let h=0; String(seed||name).split("").forEach(c=>{ h=(h*31+c.charCodeAt(0))|0; });
  const hue=hues[Math.abs(h)%hues.length];
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="hsl('+hue+',55%,52%)"/>'+
    '<text x="40" y="51" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">'+
    ini.replace(/[<&>]/g,"")+'</text></svg>';

}

/* ---- serialised writes: one in flight per document path ---- */
const writeQ=new Map();
function qWrite(path,fn){
  const prev=writeQ.get(path)||Promise.resolve();
  const next=prev.then(fn,fn).catch(e=>{ console.warn("write failed",path,e); throw e; });
  writeQ.set(path,next.catch(()=>{}));
  return next;
}

   ============================================================ */
function profDoc(id){ return db.doc("profiles/"+id); }
function threadDoc(cid){ return db.doc("threads/"+cid); }

   the shared profile doc that every member can see. */
function accountDoc(){ return db.doc("data/users/"+S.uid+"/account"); }
async function saveEmail(email){
  const clean=String(email||"").trim().toLowerCase();
  const changed=clean!==(S.account.email||"");
  const next={email:clean,emailVerified:changed?false:!!S.account.emailVerified,updatedAt:Date.now()};
  await qWrite("account",()=>accountDoc().set(next));
  S.account=next;
}

function demoProfile(d,i){

  return {id:d.id,isDemo:true,timezone:d.tz,verifiedLevels:{},
    speaks:[{code:target,level:"C2"}],practices:[{code:mine,level:"B1"}],bio:d.bio};
}
/* Every real profile plus the demo partners. */

async function demoReply(demoId,cid,lastText){
  const d=demoOf(demoId);
  S.demoTyping[demoId]=true; render();
  let text=DEMO_REPLIES[S.demoReplyN++%DEMO_REPLIES.length];
  const p=profileOf(demoId);
  const lang=langName(p.speaks[0].code);
  if(sampleFn){
    try{
      const r=await sampleFn("You are "+d.first+", a friendly native "+lang+" speaker on a language-exchange app, chatting with a learner. "+
        "Reply in 1-2 short sentences, mostly in "+lang+" at an easy level, and gently correct one mistake if there is one. "+
        "Reply with only the message.\n\nLearner wrote: "+lastText,{modelTier:"quick",cache:false});
      if(r&&r.text&&r.text.trim()) text=r.text.trim();
    }catch(e){ await new Promise(res=>setTimeout(res,900)); }
  }else{
    await new Promise(res=>setTimeout(res,1100));
  }
  const now=Date.now();
  const msgs=((S.threads[cid]||{}).messages||[]).concat([{id:"m_"+now.toString(36),from:demoId,text:text,ts:now}]).slice(-MAX_MSGS);
  S.threads[cid]={messages:msgs};

async function sendMessage(cid,otherId,text){
  const now=Date.now();
  const msg={id:"m_"+now.toString(36)+Math.random().toString(36).slice(2,6),from:S.uid,text:text,ts:now};
  const cur=S.threads[cid]||{messages:[]};
  const msgs=(cur.messages||[]).concat([msg]).slice(-MAX_MSGS);
  S.threads[cid]={messages:msgs};
  if(isDemo(otherId)){
    /* First message turns a demo match into a conversation, same as a real one. */
    S.demoConvs[otherId]=Object.assign(demoConvStub(otherId),S.demoConvs[otherId],{lastTs:now,lastText:truncate(text,90),lastFrom:S.uid});
    demoReply(otherId,cid,text);
    return msg;
  }
  await qWrite("threads/"+cid,()=>threadDoc(cid).set({messages:msgs,updatedAt:now}));
  await qWrite("conversations/"+cid,()=>convDoc(cid).set({
    participants:[S.uid,otherId].sort(),lastTs:now,lastText:truncate(text,90),lastFrom:S.uid
  }));
  return msg;
}
async function rewriteThread(cid,msgs,otherId){
  S.threads[cid]={messages:msgs};
  const last=msgs[msgs.length-1];
  if(isDemo(otherId)){
    S.demoConvs[otherId]=Object.assign(demoConvStub(otherId),S.demoConvs[otherId],{lastTs:last?last.ts:Date.now(),lastText:last?truncate(last.text,90):"",lastFrom:last?last.from:S.uid});
    return;
  }
  await qWrite("threads/"+cid,()=>threadDoc(cid).set({messages:msgs,updatedAt:Date.now()}));
  await qWrite("conversations/"+cid,()=>convDoc(cid).set({
    participants:[S.uid,otherId].sort(),
    lastTs:last?last.ts:Date.now(),
    lastText:last?truncate(last.text,90):"",
    lastFrom:last?last.from:S.uid
  }));
}

/* Matching rule: you may teach a language only at C2, and only to
   someone who lists it as a language they are practising. */
function matchInfo(me,other){
  if(!me||!other) return {iTeach:[],theyTeach:[],mutual:false,total:0};
  const theirTargets=(other.practices||[]).map(e=>e.code);
  const myTargets=(me.practices||[]).map(e=>e.code);
  const iTeach=(me.speaks||[]).filter(e=>e.level==="C2"&&theirTargets.indexOf(e.code)>=0);
  const theyTeach=(other.speaks||[]).filter(e=>e.level==="C2"&&myTargets.indexOf(e.code)>=0);
  return {iTeach:iTeach,theyTeach:theyTeach,mutual:iTeach.length>0&&theyTeach.length>0,total:iTeach.length+theyTeach.length};
}
function nameOf(id){
  if(id===S.uid) return (S.me&&S.me.name)||"You";
  if(isDemo(id)) return demoOf(id).name;
  const p=S.people[id];
  return (p&&p.name)||"Someone";
}
function avatarOf(id){
  if(isDemo(id)) return initialsAvatar(demoOf(id).first,id);
  const p=S.people[id];
  return (p&&p.avatarUrl)||initialsAvatar(nameOf(id),id);
}
function isOnline(id){ return isDemo(id)||!!S.online[id]; }
function isFav(id){ return (S.settings.favorites||[]).indexOf(id)>=0; }
function unreadFor(cid,conv){
  if(!conv||!conv.lastTs) return 0;
  if(conv.lastFrom===S.uid) return 0;
  const seen=S.settings.lastRead[cid]||0;
  return conv.lastTs>seen?1:0;
}
function totalUnread(){
  let n=0;
  S.convs.concat(Object.keys(S.demoConvs).map(k=>S.demoConvs[k])).forEach(c=>{
    const other=(c.participants||[]).filter(x=>x!==S.uid)[0];
    if(!other||(S.settings.blocks||[]).indexOf(other)>=0) return;
    if((S.settings.mutes||[]).indexOf(other)>=0) return;
    n+=unreadFor(c.id,c);
  });
  return n;
}

const view=$("view"), railWrap=$("tab-rail"), rail=$("tab-rail-inner");
const toastLayer=$("toast-layer"), menuLayer=$("menu-layer"), modalLayer=$("modal-layer"), callLayer=$("call-layer");

/* A re-render must never eat what someone is typing: capture the focused
   control's value and caret, then put both back afterwards. */
function grabFocus(){
  const el=document.activeElement;
  if(!el||!el.id||!("value" in el)) return null;
  let start=null,end=null;
  try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){}
  return {id:el.id,value:el.value,start:start,end:end,scroll:el.scrollTop};
}
function putFocus(f){
  if(!f) return;
  const el=$(f.id);
  if(!el) return;
  if("value" in el && el.value!==f.value) el.value=f.value;
  try{
    el.focus({preventScroll:true});
    if(f.start!=null&&el.setSelectionRange) el.setSelectionRange(f.start,f.end);
    if(f.scroll) el.scrollTop=f.scroll;
  }catch(e){}
}
function grabScroll(sel){ const el=view.querySelector(sel); return el?{sel:sel,top:el.scrollTop,h:el.scrollHeight}:null; }
function putScroll(s){ if(!s) return; const el=view.querySelector(s.sel); if(el) el.scrollTop=s.top; }

function toast(msg){
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  toastLayer.appendChild(el);
  const h=setTimeout(()=>{ el.remove(); toastHandles=toastHandles.filter(x=>x!==h); },2800);
  toastHandles.push(h);
}

/* confirm() can be blocked outright inside a sandboxed frame, so the app
   ships its own dialog and never calls the native one. */
function confirmDialog(opts){
  return new Promise(resolve=>{
    modalLayer.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+
      '<h3 class="h-sec">'+esc(opts.title)+'</h3>'+
      '<p class="sub">'+esc(opts.body||"")+'</p>'+
      '<div class="row" style="justify-content:flex-end;gap:8px;">'+
        '<button class="btn ghost" id="md-no">'+esc(opts.cancelLabel||"Cancel")+'</button>'+
        '<button class="btn '+(opts.danger?"danger":"primary")+'" id="md-yes">'+esc(opts.confirmLabel||"Confirm")+'</button>'+
      '</div></div>';
    const done=v=>{ modalLayer.innerHTML=""; resolve(v); };
    $("md-no").onclick=()=>done(false);
    $("md-yes").onclick=()=>done(true);
    modalLayer.onclick=e=>{ if(e.target===modalLayer) done(false); };
    $("md-yes").focus();
  });
}
function closeMenu(){ menuLayer.innerHTML=""; }
function openMenu(anchorEl,items){
  const r=anchorEl.getBoundingClientRect(), W=214, H=Math.min(items.length*38+12,300);
  let left=clamp(r.right-W,8,Math.max(8,window.innerWidth-W-8));
  let top=r.bottom+4;
  if(top+H>window.innerHeight) top=Math.max(8,r.top-H-4);
  menuLayer.innerHTML='<div class="menu" style="top:'+top+'px;left:'+left+'px;"></div>';
  const box=menuLayer.firstChild;
  items.forEach(it=>{
    const b=document.createElement("button");
    b.textContent=it.label;
    if(it.danger) b.className="danger";
    b.onclick=e=>{ e.stopPropagation(); closeMenu(); it.run(); };
    box.appendChild(b);
  });
  menuLayer.onclick=e=>{ if(e.target===menuLayer) closeMenu(); };
}

/* Every async handler runs through here: one try/catch at the top of the
   flow, so a failure anywhere can never leave a button stuck. */
async function act(fn,btn,busyLabel){
  let restore=null;
  if(btn){ restore=btn.textContent; btn.disabled=true; if(busyLabel) btn.textContent=busyLabel; }
  try{
    await fn();
  }catch(e){
    console.error(e);
    toast(dbErrorCopy(e));
  }finally{
    if(btn){ btn.disabled=false; if(restore!=null) btn.textContent=restore; }
    render();
  }
}
function dbErrorCopy(e){
  const c=e&&e.code;
  if(c==="quota_exceeded") return "This app's database is full. Delete something before adding more.";
  if(c==="resource_exhausted") return "Too many changes at once - wait a moment and try again.";
  if(c==="invalid_argument") return "That change was refused. You may only have view access here.";
  if(c==="revoked") return "Your access to this app changed. Reopen the page.";
  if(c==="unavailable") return "Could not reach the server. Try again in a moment.";
  return (e&&e.message)?("Something went wrong: "+e.message):"Something went wrong. Try again.";
}

/* Scrolls a freshly rendered error into view - an error above the fold
   reads exactly like a button that did nothing. */
function revealError(){
  const el=view.querySelector(".err");
  if(el&&el.scrollIntoView) el.scrollIntoView({block:"center",behavior:"smooth"});
}

function langChips(entries,kind){

function wireLangEditor(target,rerender){
  view.querySelectorAll("[data-le-add]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.leAdd;

    const next=(LANGS.find(l=>used.indexOf(l[0])<0)||LANGS[0])[0];
    target[key]=normLangs(target[key]).concat([{code:next,level:key==="speaks"?"C2":"A2"}]);
    rerender();
  });
  view.querySelectorAll("[data-le-del]").forEach(b=>b.onclick=()=>{
    const parts=b.dataset.leDel.split(":"), key=parts[0], i=+parts[1];
    const arr=normLangs(target[key]); arr.splice(i,1); target[key]=arr; rerender();
  });
  view.querySelectorAll("[data-le-code]").forEach(sel=>sel.onchange=()=>{
    const parts=sel.dataset.leCode.split(":"), key=parts[0], i=+parts[1];
    const arr=normLangs(target[key]); arr[i].code=sel.value; target[key]=arr; rerender();
  });
  view.querySelectorAll("[data-le-level]").forEach(sel=>sel.onchange=()=>{
    const parts=sel.dataset.leLevel.split(":"), key=parts[0], i=+parts[1];
    const arr=normLangs(target[key]); arr[i].level=sel.value; target[key]=arr; rerender();
  });
}

/* ============================================================
   9. Render dispatcher
   ============================================================ */
let renderQueued=false;
function render(){
  if(renderQueued) return;
  renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false; renderNow(); });
}
function renderNow(){
  const focus=grabFocus();
  const msgScroll=grabScroll(".msgs"), roomScroll=grabScroll(".room-msgs");
  renderChrome();
  try{
    if(!capsSettled){ renderBooting(); }
    else if(!db||!S.uid){ renderNoPlatform(); }
    else if(!S.profileLoaded){ renderBooting(); }
    else if(!S.profile){ renderOnboarding(); }
    else{
      const fn={
        "conversations":renderConversations,"discover":renderDiscover,"test-level":renderTestLevel,
        "groups":renderGroups,"schedule":renderSchedule,"practice":renderPractice,
        "profile":renderProfile,"find-teacher":renderFindTeacher,"become-teacher":renderBecomeTeacher
      }[S.tab]||renderConversations;
      fn();
      wireSheetTriggers();
    }
  }catch(e){
    console.error("render failed",e);
    view.innerHTML='<div class="col"><div class="panel"><h2 class="h-sec">Something broke while drawing this screen</h2>'+
      '<p class="sub" style="margin-top:8px;">'+esc(e&&e.message||String(e))+'</p></div></div>';
  }
  if(S.banner){
    const b=document.createElement("div");
    b.className="note warn";
    b.style.cssText="max-width:760px;margin:0 auto 16px;";
    b.textContent=S.banner;
    view.insertBefore(b,view.firstChild);
  }
  putFocus(focus);
  putScroll(msgScroll); putScroll(roomScroll);
  renderIncomingCall();
}

function convFor(otherId){
  if(isDemo(otherId)) return S.demoConvs[otherId]||null;
  const cid=convId(S.uid,otherId);
  return S.convs.filter(c=>c.id===cid)[0]||null;
}
function buildLists(){
  const blocks=S.settings.blocks||[], pins=S.settings.pins||[], archives=S.settings.archives||[], favs=S.settings.favorites||[];
  const others=allProfiles().filter(p=>p.id!==S.uid&&blocks.indexOf(p.id)<0);
  const convs=[], matches=[], archived=[], favorites=[];
  others.forEach(p=>{
    const m=matchInfo(S.profile,p), c=convFor(p.id);
    if(!c&&m.total===0) return;
    const entry={p:p,m:m,c:c,pinned:pins.indexOf(p.id)>=0,fav:favs.indexOf(p.id)>=0,
      muted:(S.settings.mutes||[]).indexOf(p.id)>=0,archived:archives.indexOf(p.id)>=0};
    if(entry.archived){ archived.push(entry); return; }
    if(entry.fav) favorites.push(entry);
    else if(c&&c.lastTs) convs.push(entry);
    else matches.push(entry);
  });
  const rank=(a,b)=>(b.pinned-a.pinned)||((b.c?b.c.lastTs:0)-(a.c?a.c.lastTs:0));
  convs.sort(rank); archived.sort(rank); favorites.sort(rank);
  matches.sort((a,b)=>(b.pinned-a.pinned)||(b.m.mutual-a.m.mutual)||(b.m.total-a.m.total));
  return {favorites:favorites,convs:convs,matches:matches,archived:archived};
}
function convRowHtml(e,active){
  const c=e.c, unread=c?unreadFor(c.id,c):0;
  const preview=S.demoTyping[e.p.id]?"typing…":c?((c.lastFrom===S.uid?"You: ":"")+c.lastText):
    (e.m.mutual?"Two-way match · say hello":"One-way match · say hello");
  return '<div class="conv-row'+(active?" active":"")+'" data-open="'+esc(e.p.id)+'" role="button" tabindex="0">'+
    sheetAvatar(e.p.id,"s")+
    '<div class="body">'+
      '<div class="nm">'+esc(nameOf(e.p.id))+(e.fav?' <span class="fav" title="Favourite">★</span>':"")+(e.pinned?' <span class="mini">pinned</span>':"")+(e.muted?' <span class="mini">muted</span>':"")+'</div>'+
      '<div class="prev">'+esc(preview)+'</div>'+
    '</div>'+
    '<div class="meta">'+
      (c&&c.lastTs?'<span class="when">'+esc(timeAgo(c.lastTs))+'</span>':"")+
      (unread&&!e.muted?'<span class="unread-dot num">'+unread+'</span>':"")+
    '</div>'+
    '<button class="icon-btn" data-menu="'+esc(e.p.id)+'" data-kind="'+(c?"conv":"match")+'" title="More options" aria-label="More options">⋯</button>'+
  '</div>';
}

  const L=buildLists();
  const sel=S.selected;

  if(sel&&!selEntry) S.selected=null;

  const listHtml=
    '<div class="panel flush conv-list">'+
      '<div class="conv-list-head">'+
        '<span class="eyebrow">'+(S.showArchived?"Archived":"Inbox")+'</span>'+

      '</div>'+

        (S.showArchived

          : ((L.favorites.length?'<div class="conv-group-label">★ Favourites</div>'+L.favorites.map(e=>convRowHtml(e,e.p.id===sel)).join(""):"")+
             (L.convs.length?'<div class="conv-group-label">Conversations</div>'+L.convs.map(e=>convRowHtml(e,e.p.id===sel)).join(""):"")+
             (L.matches.length?'<div class="conv-group-label">New matches</div>'+L.matches.map(e=>convRowHtml(e,e.p.id===sel)).join(""):"")+
             (!L.favorites.length&&!L.convs.length&&!L.matches.length?'<div class="empty" style="margin:14px;border:0;">No matches yet. Open Discover to see who is here.</div>':"")))+
      '</div>'+

  view.innerHTML='<div class="conv-grid'+(sel?" showing-thread":"")+'">'+listHtml+

  $("tog-arch").onclick=()=>{ S.showArchived=!S.showArchived; S.selected=null; render(); };
  view.querySelectorAll("[data-open]").forEach(row=>{
    const open=async()=>{

      closeMenu(); render();
      await act(()=>markRead(convId(S.uid,id)));
      const box=view.querySelector(".msgs"); if(box) box.scrollTop=box.scrollHeight;
    };
    row.onclick=e=>{ if(e.target.closest("[data-menu]")) return; open(); };

  });
  view.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    openMenu(b,personMenuItems(b.dataset.menu,{conversation:b.dataset.kind==="conv"}));

function threadHtml(e){

        (mine?'<button class="act" data-edit="'+i+'">Edit</button><button class="act" data-del="'+i+'">Delete</button>':"")+
        (!sampleUnavailable()&&!tr?'<button class="act" data-tr="'+i+'"'+(S.translating===m.id?" disabled":"")+'>'+(S.translating===m.id?"Translating…":"Translate")+'</button>':"")+
        (tr?'<button class="act" data-untr="'+esc(m.id)+'">Hide translation</button>':"")+

  }).join("");

function wireThread(e){
  const other=e.p, cid=convId(S.uid,other.id);
  const msgs=(S.threads[cid]&&S.threads[cid].messages)||[];
  const back=$("thread-back"); if(back) back.onclick=()=>{ S.selected=null; render(); };
  view.querySelectorAll(".thread-head [data-menu]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); openMenu(b,personMenuItems(b.dataset.menu,{conversation:true}));
  });
  const av=$("call-audio"), vd=$("call-video");
  if(av) av.onclick=()=>startCall(other.id,"audio");
  if(vd) vd.onclick=()=>startCall(other.id,"video");
  const dr=$("demo-ring");
  if(dr) dr.onclick=()=>{
    toast(demoOf(other.id).first+" will call you in 2 seconds…");
    setTimeout(()=>{
      if(C.active) return;
      S.demoRing={id:"demo",callId:"demo_"+Date.now().toString(36),from:other.id,to:S.uid,
        mode:(S.demoRingN=(S.demoRingN||0)+1)%2?"video":"audio",status:"ringing",startedAt:Date.now()};
      render();
    },2000);
  };

  const box=$("draft"), send=$("send");
  if(box){
    box.oninput=()=>{ S.draft[cid]=box.value; box.style.height="auto"; box.style.height=Math.min(box.scrollHeight,150)+"px"; };
    box.onkeydown=ev=>{ if(ev.key==="Enter"&&!ev.shiftKey){ ev.preventDefault(); doSend(); } };
  }
  async function doSend(){
    const text=((S.draft[cid]||"")).trim();
    if(!text) return;
    S.draft[cid]="";
    await act(async()=>{
      await sendMessage(cid,other.id,text);
      await markRead(cid);
    },send,"Sending…");
    const m=view.querySelector(".msgs"); if(m) m.scrollTop=m.scrollHeight;
  }
  if(send) send.onclick=doSend;

  view.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    S.editingIdx=+b.dataset.edit; S.editDraft=msgs[S.editingIdx].text; render();
  });
  const ec=$("edit-cancel"); if(ec) ec.onclick=()=>{ S.editingIdx=null; S.editDraft=""; render(); };
  const eb=$("edit-box"); if(eb) eb.oninput=()=>{ S.editDraft=eb.value; };
  const es=$("edit-save");
  if(es) es.onclick=()=>act(async()=>{
    const i=S.editingIdx, t=S.editDraft.trim();
    if(i==null) return;
    if(!t){ S.editingIdx=null; return; }
    const next=msgs.slice();
    next[i]=Object.assign({},next[i],{text:t,edited:true});
    S.editingIdx=null; S.editDraft="";
    await rewriteThread(cid,next,other.id);
  },es,"Saving…");

  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.del;
    const ok=await confirmDialog({title:"Delete this message?",body:"It disappears for both of you.",confirmLabel:"Delete",danger:true});
    if(!ok) return;
    await act(async()=>{
      const next=msgs.slice(); next.splice(i,1);
      await rewriteThread(cid,next,other.id);
    });
  });
  view.querySelectorAll("[data-tr]").forEach(b=>b.onclick=async()=>{
    const m=msgs[+b.dataset.tr];
    if(!m) return;
    S.translating=m.id; render();
    try{
      const target=m.from===S.uid?langName((other.practices&&other.practices[0]||{}).code||"en"):myTargetLanguage();
      S.translations[m.id]=await translateTo(m.text,target);
    }catch(err){ toast(sampleErrorCopy(err)); }
    S.translating=null; render();
  });
  view.querySelectorAll("[data-untr]").forEach(b=>b.onclick=()=>{
    delete S.translations[b.dataset.untr]; render();
  });
}

/* ============================================================
   14. Quiz Yourself - pick a CEFR level, take a short grammar +
       vocabulary quiz, get it marked, keep a history of scores
   ============================================================ */
const QUIZ_PASS=80;
function freshQuiz(keep){
  const k=keep||{};
  return {status:"idle",lang:k.lang||"",level:k.level||"",qs:[],answers:{},err:"",
    view:k.view||"take",onlyMistakes:false,score:null};
}
function letterGrade(pct){
  return pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"F";
}
function gradeTone(pct){ return pct>=80?"ok":pct>=60?"warn":"tier-c"; }
function nextLevel(lv){ const i=LEVELS.indexOf(lv); return i>=0&&i<LEVELS.length-1?LEVELS[i+1]:null; }
function prevLevel(lv){ const i=LEVELS.indexOf(lv); return i>0?LEVELS[i-1]:null; }
function quizAdvice(pct,lv){
  const up=nextLevel(lv), down=prevLevel(lv);
  if(pct>=90) return up?"Excellent - "+lv+" is comfortable for you. Try "+up+" next.":"Excellent - you've aced the top level.";
  if(pct>=QUIZ_PASS) return up?"Passed! You're ready to have a go at "+up+".":"Passed the top level. Impressive.";
  if(pct>=60) return "Nearly there. Go through the corrections below, then retake "+lv+".";
  return down?lv+" is a stretch for now. Build up with "+down+" first, then come back.":"Keep going - read the corrections below and retake it.";
}
function quizHistory(){ return (S.settings.quizHistory||[]).slice().sort((a,b)=>b.ts-a.ts); }

/* Right / wrong is worked out here from the stored answer key, never taken
   from the model; the model only supplies the explanation for each item. */
function reviewItems(t){
  return t.qs.map((q,i)=>{
    const key=Number(q.answerIndex), pick=t.answers[i];
    const state=(pick==null)?"skip":(pick===key?"right":"wrong");
    return {i:i,q:q,state:state,pick:pick,key:key,comment:String(q.explanation||"")};
  });
}
function reviewCardHtml(x){
  const opts=x.q.options||[];
  const tag={right:"✓ Correct",wrong:"✗ Mistake",skip:"— Left blank"}[x.state];
  let inner='<div class="row" style="justify-content:space-between;gap:8px;"><span class="mini">Question '+(x.i+1)+
      (x.q.section?' · '+esc(x.q.section):"")+'</span>'+
    '<span class="pill '+({right:"ok",wrong:"tier-c",skip:"warn"}[x.state])+'">'+tag+'</span></div>'+
    '<div style="font-size:14.5px;">'+esc(x.q.prompt)+'</div>';
  if(x.state!=="right") inner+='<div class="ans'+(x.state==="wrong"?" bad":"")+'"><b>You chose</b><span>'+esc(x.pick==null?"(no answer)":opts[x.pick])+'</span></div>';
  inner+='<div class="ans good"><b>'+(x.state==="right"?"Your answer":"Correct")+'</b><span>'+esc(opts[x.key]!=null?opts[x.key]:"—")+'</span></div>';
  if(x.comment) inner+='<div class="comment">'+esc(x.comment)+'</div>';
  return '<div class="rv '+x.state+'">'+inner+'</div>';
}
function cap(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
function quizQuestionsHtml(t){
  let lastSection="";
  return t.qs.map((q,i)=>{
    const sec=q.section||"";
    const head=(sec&&sec!==lastSection)?'<h3 class="h-sec quiz-sec">'+esc(cap(sec))+'</h3>':"";
    lastSection=sec;
    return head+'<div class="q-card">'+
      '<div class="mini">Question '+(i+1)+' of '+t.qs.length+'</div>'+
      '<div style="font-size:14.5px;">'+esc(q.prompt)+'</div>'+
      '<div class="q-opts">'+(q.options||[]).map((o,oi)=>
        '<label class="q-opt"><input type="radio" name="tq'+i+'" value="'+oi+'"'+(t.answers[i]===oi?" checked":"")+'><span>'+esc(o)+'</span></label>').join("")+'</div>'+
    '</div>';
  }).join("");
}
function quizResultHtml(t){
  const sc=t.score, rv=reviewItems(t);
  const shown=t.onlyMistakes?rv.filter(x=>x.state!=="right"):rv;
  const secs=Object.keys(sc.sections);
  return '<div class="grade-card">'+
      '<div class="grade-letter g-'+sc.grade.toLowerCase()+'" aria-label="Grade '+esc(sc.grade)+'">'+esc(sc.grade)+'</div>'+
      '<div class="stack" style="gap:4px;flex:1;min-width:0;">'+
        '<div class="grade-pct num">'+sc.pct+'%</div>'+
        '<div class="mini">'+esc(langName(t.lang))+' · '+esc(t.level)+' '+esc(LEVEL_LABEL[t.level])+' · '+sc.correct+' of '+sc.total+' correct</div>'+
        '<div class="chips" style="margin-top:4px;">'+secs.map(k=>
          '<span class="pill '+gradeTone(Math.round(100*sc.sections[k].c/sc.sections[k].n))+' num">'+esc(cap(k))+' '+sc.sections[k].c+'/'+sc.sections[k].n+'</span>').join("")+
          (sc.pct>=QUIZ_PASS?'<span class="pill ok">✓ '+esc(t.level)+' passed</span>':"")+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="feedback" style="background:var(--surface-2);">'+esc(quizAdvice(sc.pct,t.level))+'</div>'+
    '<div class="row wrap" style="gap:8px;">'+
      '<button class="btn primary" id="q-retake">Retake '+esc(t.level)+' (new questions)</button>'+
      (sc.pct>=QUIZ_PASS&&nextLevel(t.level)?'<button class="btn ghost" id="q-up">Try '+esc(nextLevel(t.level))+'</button>':"")+
      '<button class="btn quiet" id="q-choose">Choose another level</button>'+
    '</div>'+
    '<hr class="rule">'+
    '<div class="score-strip"><h3 class="h-sec" style="flex:1;">Corrections</h3>'+
      '<span class="pill '+(sc.correct===sc.total?"ok":"warn")+' num">'+(sc.total-sc.correct)+' to review</span></div>'+
    '<label class="checkline"><input type="checkbox" id="t-only"'+(t.onlyMistakes?" checked":"")+'><span>Only show my mistakes</span></label>'+
    (shown.length?shown.map(reviewCardHtml).join(""):'<div class="empty">No mistakes - a perfect score.</div>');
}
function quizHistoryHtml(){
  const hist=quizHistory();
  if(!hist.length) return '<div class="empty">No quizzes yet. Take one and your score lands here.</div>';
  const avg=Math.round(hist.reduce((s,h)=>s+h.pct,0)/hist.length);
  const langs=[]; hist.forEach(h=>{ if(langs.indexOf(h.lang)<0) langs.push(h.lang); });
  const best=(lang,lv)=>hist.filter(h=>h.lang===lang&&h.level===lv).reduce((m,h)=>Math.max(m,h.pct),-1);
  return '<div class="stat-row">'+
      '<div class="stat"><div class="n num">'+hist.length+'</div><div class="mini">quizzes taken</div></div>'+
      '<div class="stat"><div class="n num">'+avg+'%</div><div class="mini">average score</div></div>'+
      '<div class="stat"><div class="n num">'+hist[0].pct+'%</div><div class="mini">last score</div></div>'+
    '</div>'+
    langs.map(lang=>'<div class="stack" style="gap:8px;"><div class="mini">Best score by level · '+esc(langName(lang))+'</div>'+
      '<div class="lvl-best">'+LEVELS.map(lv=>{
        const b=best(lang,lv);
        return '<div class="lb'+(b>=QUIZ_PASS?" pass":b>=0?" tried":"")+'"><div class="lv">'+lv+'</div><div class="pc num">'+(b>=0?b+"%":"—")+'</div></div>';
      }).join("")+'</div></div>').join("")+
    '<div class="panel flush" style="box-shadow:none;">'+hist.map(h=>
      '<div class="list-row">'+
        '<div class="grade-chip g-'+esc(String(h.grade).toLowerCase())+'">'+esc(h.grade)+'</div>'+
        '<div class="body">'+
          '<div class="row" style="gap:7px;"><span style="font-weight:600;">'+esc(langName(h.lang))+'</span>'+levelPill(h.level)+'</div>'+
          '<div class="bar"><i style="width:'+Math.max(2,h.pct)+'%;" class="'+gradeTone(h.pct)+'"></i></div>'+
          '<div class="tz">'+esc(new Date(h.ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}))+' · '+h.correct+'/'+h.total+' correct</div>'+
        '</div>'+
        '<div class="hist-pct num">'+h.pct+'%</div>'+
      '</div>').join("")+'</div>'+
    '<div><button class="btn quiet sm" id="q-clear">Clear history</button></div>';
}

function renderTestLevel(){
  const p=S.profile, t=S.test;
  const codes=[];
  normLangs(p.practices).concat(normLangs(p.speaks)).forEach(e=>{ if(codes.indexOf(e.code)<0) codes.push(e.code); });
  if(!t.lang) t.lang=codes[0]||"";
  if(!t.level){
    const mine=normLangs(p.practices).concat(normLangs(p.speaks)).filter(e=>e.code===t.lang)[0];
    t.level=(mine&&mine.level)||"A2";
  }
  const histN=(S.settings.quizHistory||[]).length;
  let body="";

  if(t.view==="history"){
    body=quizHistoryHtml();
  }else if(sampleUnavailable()){
    body='<div class="note warn">Quizzes are written by Claude, which is not available in this view. Your past scores are still under Past scores.</div>';
  }else if(t.status==="idle"||t.status==="error"){
    body='<div class="field"><label>Language</label><select id="q-lang">'+
        codes.map(c=>'<option value="'+c+'"'+(t.lang===c?" selected":"")+'>'+esc(langName(c))+'</option>').join("")+'</select></div>'+
      '<div class="field"><label>Pick your level</label><div class="lvl-grid">'+LEVELS.map(lv=>
        '<button class="lvl-btn'+(t.level===lv?" on":"")+'" data-lvl="'+lv+'" aria-pressed="'+(t.level===lv)+'">'+
          '<span class="pill tier-'+tierOf(lv)+'">'+lv+'</span><span class="lvl-name">'+esc(LEVEL_LABEL[lv])+'</span></button>').join("")+'</div></div>'+
      '<p class="sub">10 questions: 5 grammar, then 5 vocabulary, all at '+esc(t.level)+'. Score '+QUIZ_PASS+'% or more to pass the level.</p>'+
      (t.err?'<div class="err">'+esc(t.err)+'</div>':"")+
      '<div><button class="btn primary" id="q-start">Start '+esc(t.level)+' quiz</button></div>';
  }else if(t.status==="generating"){
    body='<div class="thinking"><span class="spin"></span>Writing your '+esc(langName(t.lang))+' '+esc(t.level)+' quiz… about 20 seconds.</div>';
  }else if(t.status==="running"){
    const answered=Object.keys(t.answers).length;
    body='<div class="row" style="justify-content:space-between;"><span class="pill tier-'+tierOf(t.level)+'">'+esc(langName(t.lang))+' · '+esc(t.level)+'</span>'+
        '<span class="mini num" id="q-progress">'+answered+' / '+t.qs.length+' answered</span></div>'+
      quizQuestionsHtml(t)+
      '<div class="row"><button class="btn primary" id="t-submit">Finish &amp; grade</button>'+
      '<button class="btn quiet" id="t-abandon">Quit quiz</button></div>';
  }else if(t.status==="done"&&t.score){
    body=quizResultHtml(t);
  }

  view.innerHTML='<div class="col">'+
    pageHead("Quiz Yourself","Grammar & vocabulary quiz",
      "Choose a level from A1 to C2 and take a short quiz. It's marked at the end with every correction explained, and each score is saved to your history.")+
    '<div class="seg" role="tablist">'+
      '<button role="tab" aria-selected="'+(t.view!=="history")+'" class="'+(t.view!=="history"?"on":"")+'" data-qview="take">'+(t.status==="running"?"Quiz in progress":"Take a quiz")+'</button>'+
      '<button role="tab" aria-selected="'+(t.view==="history")+'" class="'+(t.view==="history"?"on":"")+'" data-qview="history">Past scores'+(histN?' <span class="num">('+histN+')</span>':"")+'</button>'+
    '</div>'+
    '<div class="panel stack">'+body+'</div></div>';

  view.querySelectorAll("[data-qview]").forEach(b=>b.onclick=()=>{ t.view=b.dataset.qview; render(); });
  const ql=$("q-lang");
  if(ql) ql.onchange=()=>{ t.lang=ql.value; t.level=""; t.err=""; render(); };
  view.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{ t.level=b.dataset.lvl; t.err=""; render(); });

  const startQuiz=async()=>{
    if(!t.lang){ t.err="Add a language to your profile first."; render(); return; }
    t.err=""; t.status="generating"; t.answers={}; t.score=null; t.onlyMistakes=false; t.view="take"; render();
    window.scrollTo({top:0,behavior:"auto"});
    try{
      const name=langName(t.lang), lv=t.level;
      const out=await askJSON(
        "Write a short multiple-choice quiz testing "+name+" at CEFR level "+lv+" ("+LEVEL_LABEL[lv]+"). "+
        "Exactly 10 questions: first 5 GRAMMAR (verb forms and tenses, agreement, articles, prepositions, pronouns, word order - whatever is typical for "+lv+"), "+
        "then 5 VOCABULARY (word meaning, choosing the right word in context, collocations, opposites, everyday phrases). "+
        "Every question must be pitched at "+lv+" - not easier, not harder. Each has exactly 4 options with exactly one correct answer, and the wrong options should be plausible learner mistakes. "+
        "Write the instruction part of each prompt in English, with the tested sentence or word in "+name+". "+
        "For each question add an explanation: 1-2 sentences in English saying why the answer is right and what the common trap is. "+
        'Reply with only JSON: {"questions":[{"section":"grammar","prompt":"...","options":["...","...","...","..."],"answerIndex":0,"explanation":"..."}]}',
        "default");
      const qs=((out&&out.questions)||[]).filter(q=>q&&q.prompt&&Array.isArray(q.options)&&q.options.length>=2&&
        Number(q.answerIndex)>=0&&Number(q.answerIndex)<q.options.length);
      if(qs.length<5) throw {code:"invalid_json",message:"malformed"};
      /* Shuffle each option list so the right answer is not always the first. */
      t.qs=qs.slice(0,12).map(q=>{
        const key=q.options[Number(q.answerIndex)];
        const opts=q.options.slice();
        for(let k=opts.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); const tmp=opts[k]; opts[k]=opts[j]; opts[j]=tmp; }
        const sec=String(q.section||"").toLowerCase();
        return {section:sec.indexOf("vocab")===0?"vocabulary":sec.indexOf("gram")===0?"grammar":sec,
          prompt:String(q.prompt),options:opts,answerIndex:opts.indexOf(key),explanation:String(q.explanation||"")};
      });
      t.status="running";
    }catch(e){ t.status="error"; t.err=sampleErrorCopy(e); setTimeout(revealError,80); }
    render();
  };
  const st=$("q-start"); if(st) st.onclick=startQuiz;

  view.querySelectorAll('input[type=radio][name^="tq"]').forEach(r=>r.onchange=()=>{
    t.answers[+r.name.slice(2)]=+r.value;
    const pr=$("q-progress"); if(pr) pr.textContent=Object.keys(t.answers).length+" / "+t.qs.length+" answered";
  });
  const ab=$("t-abandon");
  if(ab) ab.onclick=async()=>{
    const ok=await confirmDialog({title:"Quit this quiz?",body:"Your answers so far won't be saved.",confirmLabel:"Quit",danger:true});
    if(!ok) return;
    S.test=freshQuiz({lang:t.lang,level:t.level}); render();
  };
  const sub=$("t-submit");
  if(sub) sub.onclick=async()=>{
    const blank=t.qs.length-Object.keys(t.answers).length;
    if(blank>0){
      const ok=await confirmDialog({title:blank+" question"+(blank===1?"":"s")+" left blank",
        body:"Blank answers count as wrong. Grade the quiz anyway?",confirmLabel:"Grade it",cancelLabel:"Keep going"});
      if(!ok) return;
    }
    const rv=reviewItems(t), sections={};
    rv.forEach(x=>{ const k=x.q.section||"questions"; sections[k]=sections[k]||{c:0,n:0}; sections[k].n++; if(x.state==="right") sections[k].c++; });
    const correct=rv.filter(x=>x.state==="right").length, total=rv.length;
    const pct=Math.round(100*correct/total);
    t.score={correct:correct,total:total,pct:pct,grade:letterGrade(pct),sections:sections};
    t.status="done";
    window.scrollTo({top:0,behavior:"auto"});
    render();
    await act(async()=>{
      const entry={id:"q_"+Date.now().toString(36),ts:Date.now(),lang:t.lang,level:t.level,
        pct:pct,correct:correct,total:total,grade:t.score.grade};
      /* Quiz scores are private practice only - they never touch the public
         profile or teacher status. Teaching needs an uploaded certificate. */
      await saveSettings({quizHistory:(S.settings.quizHistory||[]).concat([entry]).slice(-100)});
    });
  };
  const only=$("t-only"); if(only) only.onchange=()=>{ t.onlyMistakes=only.checked; render(); };
  const rt=$("q-retake"); if(rt) rt.onclick=startQuiz;
  const up=$("q-up"); if(up) up.onclick=()=>{ t.level=nextLevel(t.level)||t.level; startQuiz(); };
  const ch=$("q-choose"); if(ch) ch.onclick=()=>{ S.test=freshQuiz({lang:t.lang,level:t.level}); render(); window.scrollTo({top:0}); };
  const cl=$("q-clear");
  if(cl) cl.onclick=async()=>{
    const ok=await confirmDialog({title:"Clear all past scores?",body:"This removes your whole quiz history. It can't be undone.",confirmLabel:"Clear",danger:true});
    if(!ok) return;
    await act(()=>saveSettings({quizHistory:[]}));
  };
}

/* ============================================================

   ============================================================ */
function renderGroups(){
  const g=S.groups;
  const room=g.activeId?S.rooms.filter(r=>r.id===g.activeId)[0]:null;
  if(g.activeId&&!room) g.activeId=null;

  if(room){
    const log=(S.roomLog[room.id]&&S.roomLog[room.id].messages)||[];
    const joined=(room.members||[]).indexOf(S.uid)>=0;
    view.innerHTML='<div class="col">'+
      '<div class="row"><button class="btn quiet sm" id="g-back">← All rooms</button></div>'+
      '<div class="panel flush">'+
        '<div class="thread-head"><div class="body">'+
          '<div style="font-family:var(--display);font-weight:700;font-size:16px;">'+esc(room.name)+'</div>'+
          '<div class="tz">'+(room.members||[]).length+' member'+((room.members||[]).length===1?"":"s")+' · '+esc(room.lang?langName(room.lang):"Any language")+'</div>'+
        '</div>'+
        (joined?'<button class="btn ghost sm" id="g-leave">Leave</button>':'<button class="btn primary sm" id="g-join">Join</button>')+
        '</div>'+
        '<div class="room-msgs">'+(log.length?log.map(m=>
          '<div class="room-msg"><div class="who">'+esc(nameOf(m.from))+' <span class="mini" style="font-weight:400;">'+esc(clockTime(m.ts))+'</span></div>'+
          '<div class="txt">'+esc(m.text)+'</div></div>').join("")
          :'<div class="empty" style="border:0;margin:auto;">Nothing said yet. Open with a question in your target language.</div>')+'</div>'+
        (joined?'<div class="composer"><textarea id="g-draft" rows="1" placeholder="Message the room…">'+esc(g.draft)+'</textarea>'+
          '<button class="btn primary" id="g-send">Send</button></div>'
          :'<div class="note" style="margin:14px;">Join the room to post.</div>')+
      '</div></div>';

    $("g-back").onclick=()=>{ g.activeId=null; render(); };
    const jb=$("g-join");
    if(jb) jb.onclick=()=>act(async()=>{
      const members=(room.members||[]).concat([S.uid]);
      await qWrite("rooms/"+room.id,()=>db.doc("rooms/"+room.id).update({members:members}));
    },jb,"Joining…");
    const lb=$("g-leave");
    if(lb) lb.onclick=()=>act(async()=>{
      const members=(room.members||[]).filter(x=>x!==S.uid);
      await qWrite("rooms/"+room.id,()=>db.doc("rooms/"+room.id).update({members:members}));
    },lb,"Leaving…");
    const box=$("g-draft");
    if(box){
      box.oninput=()=>{ g.draft=box.value; };
      box.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendRoom(); } };
    }
    const sb=$("g-send"); if(sb) sb.onclick=sendRoom;
    function sendRoom(){
      const text=g.draft.trim(); if(!text) return;
      g.draft="";
      act(async()=>{
        const msgs=log.concat([{from:S.uid,text:text,ts:Date.now()}]).slice(-MAX_MSGS);
        S.roomLog[room.id]={messages:msgs};
        await qWrite("roomchats/"+room.id,()=>db.doc("roomchats/"+room.id).set({messages:msgs,updatedAt:Date.now()}));
      },sb,"Sending…");
    }
    const rm=view.querySelector(".room-msgs"); if(rm) rm.scrollTop=rm.scrollHeight;
    return;
  }

  view.innerHTML='<div class="col">'+
    pageHead("Groups","Practice rooms","Open rooms anyone here can join - useful when you want more than one voice, or a language nobody has matched you on yet.")+
    '<div class="panel stack">'+
      '<h3 class="h-sec">Start a room</h3>'+
      '<div class="field"><label>Room name</label><input type="text" id="g-name" maxlength="60" placeholder="e.g. Spanish small talk, Tuesdays" value="'+esc(g.newName)+'"></div>'+
      '<div class="field"><label>Language (optional)</label>'+langSelect("g-lang",g.lang||"","Any language")+'</div>'+
      (g.err?'<div class="err">'+esc(g.err)+'</div>':"")+
      '<div><button class="btn primary" id="g-create">Create room</button></div>'+
    '</div>'+
    '<div class="stack" style="gap:10px;">'+
      '<h3 class="h-sec">Open rooms ('+S.rooms.length+')</h3>'+
      (S.rooms.length?'<div class="panel flush">'+S.rooms.map(r=>
        '<div class="list-row"><div class="body">'+
          '<div style="font-weight:600;">'+esc(r.name)+'</div>'+
          '<div class="sub">'+(r.members||[]).length+' member'+((r.members||[]).length===1?"":"s")+
          ' · started by '+esc(nameOf(r.createdBy))+(r.lang?" · "+esc(langName(r.lang)):"")+'</div>'+
        '</div>'+
        ((r.members||[]).indexOf(S.uid)>=0?'<span class="pill teal">joined</span>':"")+
        '<button class="btn ghost sm" data-open-room="'+esc(r.id)+'">Open</button>'+
        (r.createdBy===S.uid?'<button class="icon-btn" data-del-room="'+esc(r.id)+'" aria-label="Delete room">✕</button>':"")+
        '</div>').join("")+'</div>'
        :'<div class="empty">No rooms yet. Start the first one.</div>')+
    '</div></div>';

  const nm=$("g-name"); if(nm) nm.oninput=()=>{ g.newName=nm.value; };
  const gl=$("g-lang"); if(gl) gl.onchange=()=>{ g.lang=gl.value; };
  const cb=$("g-create");
  cb.onclick=()=>{
    const name=g.newName.trim();
    if(!name){ g.err="Give the room a name."; render(); setTimeout(revealError,0); return; }
    g.err="";
    act(async()=>{
      const id="room_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await db.doc("rooms/"+id).set({name:name.slice(0,60),lang:g.lang||"",createdBy:S.uid,members:[S.uid],createdAt:Date.now()});
      g.newName=""; g.activeId=id;
    },cb,"Creating…");
  };
  view.querySelectorAll("[data-open-room]").forEach(b=>b.onclick=()=>{
    g.activeId=b.dataset.openRoom; g.draft=""; render();
  });
  view.querySelectorAll("[data-del-room]").forEach(b=>b.onclick=async()=>{
    const ok=await confirmDialog({title:"Delete this room?",body:"The room and everything said in it goes for everyone.",confirmLabel:"Delete",danger:true});
    if(!ok) return;
    await act(async()=>{
      await db.doc("rooms/"+b.dataset.delRoom).delete();
      await db.doc("roomchats/"+b.dataset.delRoom).delete();
    });
  });
}

function renderSchedule(){
  const s=S.sched;
  const L=buildLists();
  const people=L.favorites.concat(L.convs,L.matches).map(e=>e.p);
  const items=(S.settings.schedule||[]).slice()
    .filter(x=>x.whenTs>=Date.now()-3600000).sort((a,b)=>a.whenTs-b.whenTs);
  const past=(S.settings.schedule||[]).filter(x=>x.whenTs<Date.now()-3600000).length;

  view.innerHTML='<div class="col">'+
    pageHead("Schedule","Book a call for later",
      "Your own reminder list. Times are shown in your timezone ("+tzLabel(S.profile.timezone)+") - check theirs in the thread header before proposing one.")+
    '<div class="panel stack">'+
      '<div class="field"><label>With</label><select id="s-who"><option value="">Choose a person…</option>'+
        people.map(p=>'<option value="'+esc(p.id)+'"'+(s.withId===p.id?" selected":"")+'>'+esc(nameOf(p.id))+
          (p.timezone?" — "+esc(tzNow(p.timezone))+" their time":"")+'</option>').join("")+'</select></div>'+
      '<div class="field"><label>Date and time</label><input type="datetime-local" id="s-when" value="'+esc(s.when)+'"></div>'+
      '<div class="field"><label>Note</label><input type="text" id="s-note" maxlength="140" placeholder="e.g. Practise ordering food in Spanish" value="'+esc(s.note)+'"></div>'+
      (s.err?'<div class="err">'+esc(s.err)+'</div>':"")+
      '<div><button class="btn primary" id="s-add">Add to schedule</button></div>'+
    '</div>'+
    '<div class="stack" style="gap:10px;">'+
      '<h3 class="h-sec">Upcoming ('+items.length+')'+(past?' <span class="mini" style="font-weight:400;">· '+past+' past</span>':"")+'</h3>'+
      (items.length?'<div class="panel flush">'+items.map(it=>{
        const dt=new Date(it.whenTs);
        const other=profileOf(it.withId);
        return '<div class="list-row">'+
          '<div class="when-block"><div class="d">'+esc(dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}))+'</div>'+
          '<div class="t num">'+esc(dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}))+'</div></div>'+
          '<div class="body"><div style="font-weight:600;">'+esc(nameOf(it.withId))+'</div>'+
          (it.note?'<div class="sub">'+esc(it.note)+'</div>':"")+
          (other&&other.timezone?'<div class="tz">'+esc(new Intl.DateTimeFormat(undefined,{timeZone:other.timezone,hour:"2-digit",minute:"2-digit"}).format(dt))+' their time</div>':"")+
          '</div>'+
          '<button class="btn ghost sm" data-sched-open="'+esc(it.withId)+'">Open chat</button>'+
          '<button class="icon-btn" data-sched-del="'+esc(it.id)+'" aria-label="Cancel">✕</button></div>';
      }).join("")+'</div>':'<div class="empty">Nothing scheduled yet.</div>')+
    '</div></div>';

  const who=$("s-who"); if(who) who.onchange=()=>{ s.withId=who.value; };
  const wh=$("s-when"); if(wh) wh.oninput=()=>{ s.when=wh.value; };
  const nt=$("s-note"); if(nt) nt.oninput=()=>{ s.note=nt.value; };
  const add=$("s-add");
  add.onclick=()=>{
    s.err="";
    if(!s.withId) s.err="Choose who you are scheduling with.";
    else if(!s.when) s.err="Pick a date and time.";
    else{
      const ts=new Date(s.when).getTime();
      if(isNaN(ts)) s.err="That date did not parse. Pick it again.";
      else if(ts<Date.now()) s.err="Pick a time in the future.";
    }
    if(s.err){ render(); setTimeout(revealError,0); return; }
    act(async()=>{
      const item={id:"s_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        withId:s.withId,whenTs:new Date(s.when).getTime(),note:s.note.slice(0,140)};
      await saveSettings({schedule:(S.settings.schedule||[]).concat([item])});
      s.withId=""; s.when=""; s.note="";
      toast("Added to your schedule.");
    },add,"Adding…");
  };
  view.querySelectorAll("[data-sched-open]").forEach(b=>b.onclick=()=>openThreadWith(b.dataset.schedOpen));
  view.querySelectorAll("[data-sched-del]").forEach(b=>b.onclick=()=>act(()=>
    saveSettings({schedule:(S.settings.schedule||[]).filter(x=>x.id!==b.dataset.schedDel)})));
}

function renderPractice(){
  const p=S.profile, a=S.assign, st=S.settings.streak||{count:0,lastDate:""};

  const target=normLangs(p.practices)[0]||null;
  const targetName=target?langName(target.code):null;
  const prompt=PRACTICE_PROMPTS[(new Date().getDate()+String(S.uid||"").length)%PRACTICE_PROMPTS.length];

  let assignHtml;

    assignHtml='<div class="empty">Add a language you are learning in your Profile to get daily assignments.</div>';

      '<div class="feedback">'+esc(a.feedback)+'</div>'+
      '<div><button class="btn ghost" id="a-new">New assignment</button></div></div>';
  }

  const ladder=[];
  for(let i=0;i<7;i++) ladder.push('<i class="'+(i<Math.min(st.count,7)?"on":"")+'"></i>');

  view.innerHTML='<div class="col">'+
    pageHead("Practice","Keep the habit going","Mark the day once you have practised - on a call, in a room, or on your own.")+
    '<div class="streak-card">'+
      '<div><div class="streak-n num">'+st.count+'</div>'+
        '<div class="mini">day'+(st.count===1?"":"s")+' in a row</div>'+
        '<div class="streak-ladder">'+ladder.join("")+'</div></div>'+
      '<div style="flex:1;"></div>'+
      '<button class="btn primary" id="mark-day"'+(doneToday?" disabled":"")+'>'+(doneToday?"✓ Logged for today":"Mark today practised")+'</button>'+
    '</div>'+
    '<div class="panel stack">'+
      '<div class="mini">Today’s prompt</div>'+
      '<p style="font-size:15px;">'+esc(prompt)+'</p>'+
      '<p class="sub">Try it in '+esc(normLangs(p.practices).map(e=>langName(e.code)).join(" or ")||"your target language")+'. Say it out loud, write it down, or bring it into your next call.</p>'+
    '</div>'+
    '<div class="stack" style="gap:10px;"><h3 class="h-sec">Daily assignment</h3>'+assignHtml+'</div>'+

async function downscaleImage(file,maxDim,quality){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(bmp.width*scale));
  c.height=Math.max(1,Math.round(bmp.height*scale));
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close) bmp.close();
  return c.toDataURL("image/jpeg",quality);
}
